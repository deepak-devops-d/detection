apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: career-ai-backend
  namespace: career-ai-prod
spec:
  podSelector:
    matchLabels:
      app: career-ai-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: career-ai-prod
  egress:
    - {} # Required for AWS Bedrock API access and DNS; tighten further with egress controls if using an egress gateway.
